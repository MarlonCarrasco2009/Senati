<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Interfaz de inicio de sesión SENATI.">
  <title>SENATI | Iniciar sesión</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f5f7fa; background: radial-gradient(circle at 50% 0%, #1b2438 0%, #0e111b 28%, #050608 78%); }
    .login { width: min(100%, 420px); padding: clamp(28px, 7vw, 44px); background: #11131b; border: 1px solid #303543; border-radius: 24px; box-shadow: 0 26px 70px #0009; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 900; letter-spacing: .09em; }
    .brand-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; color: white; background: #2465ee; font-size: 18px; letter-spacing: 0; }
    .eyebrow { margin: 30px 0 8px; color: #91afff; font-size: 12px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 32px); letter-spacing: -.035em; }
    .intro { color: #a8afbe; line-height: 1.55; margin: 12px 0 28px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 18px 0 9px; }
    .field { position: relative; }
    input { width: 100%; min-height: 52px; padding: 0 16px; background: #090b11; border: 1px solid #363b4a; border-radius: 12px; color: #fff; outline: none; font: inherit; }
    input:focus { border-color: #6b99ff; box-shadow: 0 0 0 3px #3366ee30; }
    input::placeholder { color: #777f90; }
    .password { padding-right: 82px; }
    .toggle { position: absolute; right: 7px; top: 7px; height: 38px; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; color: #91afff; cursor: pointer; font-size: 13px; }
    .submit { width: 100%; min-height: 52px; margin-top: 28px; border: 0; border-radius: 12px; background: #2465ee; color: #fff; font: inherit; font-weight: 750; cursor: pointer; transition: background .2s, transform .2s; }
    .submit:hover { background: #3d7bff; transform: translateY(-1px); }
    .submit:focus-visible,.toggle:focus-visible { outline: 3px solid #a4bfff; outline-offset: 3px; }
    .feedback { min-height: 22px; margin: 18px 0 0; text-align: center; font-size: 13px; line-height: 1.5; color: #aeb8ca; }
    .note { margin: 24px 0 0; padding-top: 18px; border-top: 1px solid #303543; color: #888fa0; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="login">
    <div class="brand"><span class="brand-icon" aria-hidden="true">S</span> SENATI</div>
    <p class="eyebrow">Portal estudiantil · Demo</p>
    <h1>Bienvenido de nuevo</h1>
    <p class="intro">Ingresa tus datos para continuar.</p>
    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <div class="field">
        <input id="email" name="email" type="email" placeholder="nombre@ejemplo.com" autocomplete="username" required>
      </div>
      <label for="password">Contraseña</label>
      <div class="field">
        <input id="password" class="password" name="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" minlength="8" required>
        <button class="toggle" type="button" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
      </div>
      <button class="submit" type="submit">Iniciar sesión</button>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </form>
    <p class="note">Diseño de práctica no oficial. No se conecta a los sistemas de SENATI ni valida cuentas reales. No ingreses contraseñas reales.</p>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const password = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');
    const feedback = document.getElementById('feedback');

    toggle.addEventListener('click', () => {
      const visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      toggle.textContent = visible ? 'Mostrar' : 'Ocultar';
      toggle.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
      toggle.setAttribute('aria-pressed', String(!visible));
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      feedback.textContent = 'Formulario de demostración: para iniciar sesión de verdad se necesita un servidor seguro y autenticación.';
    });
  </script>
</body>
</html>
